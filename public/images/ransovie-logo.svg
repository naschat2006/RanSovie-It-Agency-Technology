<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Metallic Gold Outer Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#B48811" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Cyber Gold/Cyan Accent -->
    <linearGradient id="cyberAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Ambient Halo -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Golden Tech Glow Behind Badge -->
  <circle cx="50" cy="50" r="44" fill="url(#ambientGlow)" />

  <!-- Outer Hexagonal Tech Badge -->
  <polygon points="50,4 88,25 88,75 50,96 12,75 12,25" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Inner Concentric Hexagon Contour -->
  <polygon points="50,11 82,29 82,71 50,89 18,71 18,29" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.4" />

  <!-- Corner Tech Accents -->
  <circle cx="50" cy="4" r="2.2" fill="#FDE047" />
  <circle cx="88" cy="25" r="2" fill="#D4AF37" />
  <circle cx="88" cy="75" r="2" fill="#D4AF37" />
  <circle cx="50" cy="96" r="2.2" fill="#FDE047" />
  <circle cx="12" cy="75" r="2" fill="#D4AF37" />
  <circle cx="12" cy="25" r="2" fill="#D4AF37" />

  <!-- Stylized Monogram 'R' (Crisp, High-Precision Vector Silhouette) -->
  <path d="M29 25 L47 25 C57 25 63 30 63 38 C63 44.5 58 48.5 50 49.8 L64 75 L53 75 L40.5 52 L38 52 L38 75 L29 75 Z M38 33 L38 45 L46.5 45 C51.5 45 54 43 54 39 C54 35 51.5 33 46.5 33 Z" fill="url(#goldGrad)" />

  <!-- Futuristic Cyber Wave 'S' (Aerodynamic Overlay Ribbon with Cyan Tip) -->
  <path d="M43 62 C47 64.5 52 66 57 66 C63.5 66 67.5 62.5 67.5 57.5 C67.5 52 61.5 49 53.5 46 C42.5 42 34.5 37 34.5 28 C34.5 23.5 37.5 19.5 42.5 17 L47 23 C43.5 24.5 41.5 26.5 41.5 28.5 C41.5 32 46.5 34 54.5 37 C65.5 41 74.5 46.5 74.5 57 C74.5 67 66.5 73 55.5 73 C48.5 73 43.5 71 39.5 67.5 Z" fill="url(#cyberAccent)" opacity="0.92" />

  <!-- Innovation Spark (Center Node at Intersection) -->
  <polygon points="52.5,43 54.5,47.5 58.5,49.5 54.5,51.5 52.5,56 50.5,51.5 46.5,49.5 50.5,47.5" fill="#FFFFFF" />
  <circle cx="52.5" cy="49.5" r="1.5" fill="#38BDF8" />
</svg>
